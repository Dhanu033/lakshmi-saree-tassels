<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAKSHMI | Saree Tassels</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8f2;
  color:#3b2430;
}

header{
  background:linear-gradient(135deg,#7d163d,#b83c69);
  color:#fff;
  padding:28px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:34px;
  letter-spacing:2px
}

header p{
  margin:8px 0 0;
  opacity:.9
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:24px 16px
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:18px
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px #00000012;
  border:1px solid #f1dce4
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#f5e8ed;
  cursor:pointer;
}

.noimg{
  height:210px;
  display:grid;
  place-items:center;
  color:#9b7180;
  background:#f7edf1
}

.info{
  padding:14px
}

.name{
  font-weight:700;
  font-size:17px
}

.price{
  color:#a51f52;
  font-size:19px;
  font-weight:700;
  margin:7px 0 12px
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-weight:700;
  cursor:pointer
}

.select{
  background:#a51f52;
  color:#fff;
  width:100%
}

.selected{
  background:#f1d1dd;
  color:#7d163d;
  width:100%
}

/* Selection box */
.order{
  background:#fff;
  border:1px solid #ead1da;
  border-radius:14px;
  padding:12px 15px;
  box-shadow:0 5px 18px #0001;
  margin-top:25px;
}

.order h2{
  margin:0;
  font-size:16px;
  color:#7d163d;
}

.selection-content{
  margin-top:12px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row input{
  flex:1;
  min-width:220px;
  padding:12px;
  border:1px solid #d9bdc7;
  border-radius:10px;
}

.whatsapp{
  background:#1fa855;
  color:#fff;
}

.small{
  font-size:13px;
  color:#80616c
}

.empty{
  text-align:center;
  padding:50px;
  color:#80616c
}

.hidden{
  display:none;
}

/* Full image viewer */
.image-viewer{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.92);
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  max-width:90%;
  max-height:80%;
  object-fit:contain;
  transition:transform .2s ease;
  cursor:grab;
  user-select:none;
}

.close-viewer{
  position:absolute;
  top:15px;
  right:18px;
  background:#fff;
  color:#7d163d;
  width:45px;
  height:45px;
  border-radius:50%;
  font-size:25px;
  padding:0;
}

.zoom-controls{
  position:absolute;
  bottom:25px;
  display:flex;
  gap:12px;
}

.zoom-controls button{
  background:#fff;
  color:#7d163d;
  font-size:20px;
  width:50px;
  height:45px;
}
</style>
</head>

<body>

<header>
  <h1>LAKSHMI</h1>
  <p>Saree Tassels Collection</p>
</header>

<div class="wrap">

  <div id="products" class="products"></div>

  <div class="order">

    <h2>Your Selection</h2>

    <div id="selectionContent" class="selection-content hidden">

      <div id="selection" class="small"></div>

      <div class="row" style="margin-top:12px">
        <input id="customerName" placeholder="Enter your name">
        <button class="whatsapp" onclick="sendOrder()">
          Send Selection on WhatsApp
        </button>
      </div>

      <div class="small" style="margin-top:8px">
        Your WhatsApp message will open with the selected tassels and prices.
      </div>

    </div>

  </div>

</div>


<!-- Full Image Viewer -->

<div id="imageViewer" class="image-viewer">

  <button class="close-viewer" onclick="closeViewer()">×</button>

  <img id="viewerImage" src="" alt="Tassel">

  <div class="zoom-controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="resetZoom()">Reset</button>
    <button onclick="zoomIn()">+</button>
  </div>

</div>


<script>

let products=[];
let selected=new Set();

let currentZoom=1;


/* Load products */

async function load(){

  const r=await fetch('/api/products');

  products=await r.json();

  render();
}


/* Display products */

function render(){

  const box=document.getElementById('products');

  if(!products.length){

    box.innerHTML='<div class="empty">New tassels will be added soon.</div>';

    return;
  }

  box.innerHTML=products.map(p=>`

    <div class="card">

      ${
        p.image
        ?
        `<img
          src="${p.image}"
          alt="${esc(p.name)}"
          onclick="openViewer('${p.image}')"
        >`
        :
        `<div class="noimg">LAKSHMI</div>`
      }

      <div class="info">

        <div class="name">
          ${esc(p.name)}
        </div>

        <div class="price">
          ₹${Number(p.price).toFixed(0)}
        </div>

        <button
          class="${selected.has(p.id)?'selected':'select'}"
          onclick="toggle(${p.id})"
        >
          ${selected.has(p.id)?'Selected ✓':'Select'}
        </button>

      </div>

    </div>

  `).join('');

  updateSelection();
}


/* Select / unselect */

function toggle(id){

  if(selected.has(id)){

    selected.delete(id);

  }else{

    selected.add(id);

  }

  render();
}


/* Update selection area */

function updateSelection(){

  const chosen=products.filter(p=>selected.has(p.id));

  const content=document.getElementById('selectionContent');

  const selection=document.getElementById('selection');


  if(!chosen.length){

    content.classList.add('hidden');

    selection.innerHTML='';

    return;

  }


  content.classList.remove('hidden');


  selection.innerHTML=chosen
    .map(p=>`${esc(p.name)} — ₹${Number(p.price).toFixed(0)}`)
    .join('<br>');
}


/* Send WhatsApp order */

function sendOrder(){

  const name=document
    .getElementById('customerName')
    .value
    .trim();

  const chosen=products.filter(p=>selected.has(p.id));


  if(!name){

    alert('Please enter your name.');

    return;
  }


  if(!chosen.length){

    alert('Please select at least one tassel.');

    return;
  }


  const lines=chosen
    .map(p=>`• ${p.name} - ₹${Number(p.price).toFixed(0)}`)
    .join('\n');


  const total=chosen
    .reduce((s,p)=>s+Number(p.price),0);


  const msg=
`Hello LAKSHMI,

My name is ${name}. I would like these saree tassels:
${lines}

Total: ₹${total.toFixed(0)}

Please confirm availability.`;


  window.open(
    'https://wa.me/919398463438?text='+
    encodeURIComponent(msg),
    '_blank'
  );
}


/* Open full image */

function openViewer(image){

  const viewer=document.getElementById('imageViewer');

  const img=document.getElementById('viewerImage');

  img.src=image;

  currentZoom=1;

  img.style.transform='scale(1)';

  viewer.classList.add('show');
}


/* Close image */

function closeViewer(){

  document
    .getElementById('imageViewer')
    .classList.remove('show');
}


/* Zoom in */

function zoomIn(){

  currentZoom+=0.25;

  if(currentZoom>3){
    currentZoom=3;
  }

  document
    .getElementById('viewerImage')
    .style.transform=
    `scale(${currentZoom})`;
}


/* Zoom out */

function zoomOut(){

  currentZoom-=0.25;

  if(currentZoom<1){
    currentZoom=1;
  }

  document
    .getElementById('viewerImage')
    .style.transform=
    `scale(${currentZoom})`;
}


/* Reset zoom */

function resetZoom(){

  currentZoom=1;

  document
    .getElementById('viewerImage')
    .style.transform=
    'scale(1)';
}


/* Close viewer by tapping outside image */

document
  .getElementById('imageViewer')
  .addEventListener('click',function(e){

    if(e.target===this){

      closeViewer();

    }

  });


/* Escape key */

document.addEventListener('keydown',function(e){

  if(e.key==='Escape'){

    closeViewer();

  }

});


/* Protect text */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}


load();

</script>

</body>
</html>
